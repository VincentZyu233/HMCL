name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Action'
        required: true
        default: 'build'
        type: choice
        options:
          - 'check-only'
          - 'build'
          - 'release'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  # ── 阶段 1：代码与多语言检查（整合上游 3，永远执行） ───────────────
  check:
    name: Check Codes
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.flags.outputs.should_build }}
      should_release: ${{ steps.flags.outputs.should_release }}
      version: ${{ steps.flags.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          java-package: 'jdk+fx'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: never

      - name: Run Checkstyle & Translations
        run: ./gradlew checkstyle checkTranslations --no-daemon --parallel --stacktrace

      - name: Parse Commit Message & Flags
        id: flags
        shell: bash
        run: |
          MSG="$(git log -1 --format=%B)"
          echo "Commit message: $MSG"

          VERSION="v3.17.0-vincentzyu.1"
          if [[ "${{ github.ref_name }}" =~ ^v[0-9] ]]; then
            VERSION="${{ github.ref_name }}"
          fi

          BUILD=false
          RELEASE=false

          has_trigger() {
            printf '%s\n' "$MSG" | grep -qiE "(^|[^[:alnum:]_-])\\[$1\\]([^[:alnum:]_-]|$)"
          }

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ github.event.inputs.build_type }}" in
              "check-only")
                BUILD=false
                RELEASE=false
                ;;
              "build")
                BUILD=true
                RELEASE=false
                ;;
              "release")
                BUILD=true
                RELEASE=true
                ;;
            esac
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            BUILD=true
            RELEASE=true
          else
            if has_trigger "build-release"; then
              BUILD=true
              RELEASE=true
            elif has_trigger "build-action"; then
              BUILD=true
              RELEASE=false
            fi
          fi

          echo "should_build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "should_release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "🏁 Flags: should_build=$BUILD, should_release=$RELEASE, version=$VERSION"

  # ── 阶段 2：全平台交叉编译（整合上游 1，由标签驱动） ───────────────
  build:
    name: Build All Platforms
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'liberica'
          java-version: '17'
          java-package: 'jdk+fx'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: never

      - name: Build with Gradle
        run: xvfb-run --auto-servernum ./gradlew build --no-daemon --parallel
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
          HMCL_FORK_VERSION: ${{ needs.check.outputs.version }}

      - name: Archive Built Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: HMCL-${{ needs.check.outputs.version }}-artifacts
          path: |
            HMCL/build/libs/HMCL-*.jar
            HMCL/build/libs/HMCL-*.exe
            HMCL/build/libs/HMCL-*.sh
            HMCL/build/libs/HMCL-*.deb

  # ── 阶段 3：自动生成发布（整合上游 2，由 [build-release] 驱动） ─────
  release:
    name: Create GitHub Release
    needs: [check, build]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: HMCL-${{ needs.check.outputs.version }}-artifacts
          path: artifacts

      - name: Calculate Checksums & Generate Release Notes
        shell: bash
        run: |
          cd artifacts
          echo "# HMCL ${{ needs.check.outputs.version }} (vincentzyu-fork)" > RELEASE_NOTE.md
          echo "" >> RELEASE_NOTE.md
          echo "🎉 **定制特性**：" >> RELEASE_NOTE.md
          echo "- 🚀 内置专属 **OpenBMCLAPI** 智能重定向与本地 HMAC-SHA1 签名计算，直连私有 iMac 节点加速" >> RELEASE_NOTE.md
          echo "- 🛡️ 永久地域中立免疫，彻底杜绝合规自阉割下载阻断" >> RELEASE_NOTE.md
          echo "- 🎨 专属定制徽标 Logo 与 \`(vincentzyu-fork)\` 界面标识" >> RELEASE_NOTE.md
          echo "" >> RELEASE_NOTE.md
          echo "### 📦 文件校验列表 (SHA-256 Checksum)" >> RELEASE_NOTE.md
          echo "" >> RELEASE_NOTE.md
          echo "| 文件名 | SHA-256 校验码 |" >> RELEASE_NOTE.md
          echo "| :--- | :--- |" >> RELEASE_NOTE.md

          for f in HMCL-*; do
            if [[ -f "$f" && "$f" != *.sha* && "$f" != *.md ]]; then
              SHA=$(sha256sum "$f" | cut -d' ' -f1)
              echo "$SHA  $f" > "$f.sha256"
              echo "| \`$f\` | \`$SHA\` |" >> RELEASE_NOTE.md
            fi
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cd artifacts
          gh release create "${{ needs.check.outputs.version }}" \
            HMCL-* \
            --title "HMCL ${{ needs.check.outputs.version }} (vincentzyu-fork)" \
            --notes-file RELEASE_NOTE.md \
            --target "${{ github.sha }}"
